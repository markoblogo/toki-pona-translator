<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sitelen emoji mapping</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f2;
        --panel: #ffffff;
        --text: #202124;
        --muted: #65666a;
        --line: #d9dbd2;
        --accent: #0f766e;
        --accent-soft: #d9f3ee;
        --shadow: 0 12px 30px rgb(0 0 0 / 8%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161716;
          --panel: #202220;
          --text: #f2f4ef;
          --muted: #b5bab0;
          --line: #3a3d38;
          --accent: #5eead4;
          --accent-soft: #153c38;
          --shadow: none;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      header {
        display: grid;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4.5rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        max-width: 760px;
      }

      a {
        color: var(--accent);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        gap: 12px;
        margin: 0 -8px 18px;
        padding: 8px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(12px);
      }

      input[type="search"] {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 9px;
        background: var(--panel);
      }

      section {
        margin-top: 24px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 1.1rem;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
        text-align: left;
        white-space: nowrap;
      }

      th {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 650;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .emoji {
        font-size: 1.8rem;
        line-height: 1;
      }

      .word {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .empty,
      .error {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: var(--panel);
        color: var(--muted);
      }

      mark {
        border-radius: 4px;
        padding: 0 2px;
        background: var(--accent-soft);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>sitelen emoji mapping</h1>
        <p>Browse pinned toki pona → sitelen emoji profiles. Search by word, alias, utility key, or emoji.</p>
        <div class="actions">
          <a class="button" href="/">Translator</a>
          <a id="raw-link" class="button" href="./profiles/default-stable.v1.json">Raw JSON</a>
          <a class="button" href="mapping.md">Mapping reference</a>
          <a class="button" href="coverage.md">Coverage report</a>
          <a class="button" href="https://toki.abvx.xyz/kit">Reader's Kit</a>
        </div>
      </header>

      <div class="toolbar">
        <select id="profile" aria-label="Profile">
          <option value="default-stable.v1.json">default-stable</option>
          <option value="minimal.v1.json">minimal</option>
          <option value="extended.v1.json">extended</option>
        </select>
        <input id="search" type="search" placeholder="Search toki, emoji, alias, _punct_period..." autocomplete="off" />
        <div id="stats" class="stats" aria-live="polite"></div>
      </div>

      <div id="app" aria-live="polite">
        <div class="empty">Loading profile...</div>
      </div>
    </main>

    <script>
      const PROFILE_BASE = "./profiles/";
      const profileSelect = document.querySelector("#profile");
      const search = document.querySelector("#search");
      const stats = document.querySelector("#stats");
      const app = document.querySelector("#app");
      const rawLink = document.querySelector("#raw-link");
      let rows = [];

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function classifyRows(profile) {
        const aliases = profile.aliases || {};
        const entries = profile.entries || {};
        return Object.entries(entries).map(([word, emoji]) => {
          const isUtility = word.startsWith("_");
          const canonical = aliases[word] || "";
          return {
            word,
            emoji,
            canonical,
            kind: isUtility ? "Utility entries" : canonical ? "Aliases" : "Core words",
          };
        });
      }

      function matches(row, term) {
        if (!term) return true;
        return [row.word, row.emoji, row.canonical, row.kind].some((value) => value.toLowerCase().includes(term));
      }

      function renderTable(title, groupRows) {
        if (!groupRows.length) return "";
        const body = groupRows
          .map((row) => {
            const canonical = row.canonical ? `<span class="word">${escapeHtml(row.canonical)}</span>` : "";
            return `<tr><td class="word">${escapeHtml(row.word)}</td><td class="emoji">${escapeHtml(row.emoji)}</td><td>${canonical}</td></tr>`;
          })
          .join("");
        return `<section><h2>${escapeHtml(title)} <span class="pill">${groupRows.length}</span></h2><div class="table-wrap"><table><thead><tr><th>word</th><th>emoji</th><th>canonical</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
      }

      function render() {
        const term = search.value.trim().toLowerCase();
        const visible = rows.filter((row) => matches(row, term));
        const groups = ["Core words", "Aliases", "Utility entries"];

        stats.innerHTML = [
          `<span class="pill">${visible.length}/${rows.length} shown</span>`,
          ...groups.map((name) => `<span class="pill">${escapeHtml(name)}: ${visible.filter((row) => row.kind === name).length}</span>`),
        ].join("");

        if (!visible.length) {
          app.innerHTML = `<div class="empty">No entries match <mark>${escapeHtml(search.value)}</mark>.</div>`;
          return;
        }

        app.innerHTML = groups.map((name) => renderTable(name, visible.filter((row) => row.kind === name))).join("");
      }

      async function loadSelectedProfile() {
        const profileUrl = PROFILE_BASE + profileSelect.value;
        rawLink.href = profileUrl;
        app.innerHTML = `<div class="empty">Loading profile...</div>`;
        try {
          const response = await fetch(profileUrl, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const profile = await response.json();
          rows = classifyRows(profile).sort((a, b) => a.kind.localeCompare(b.kind) || a.word.localeCompare(b.word));
          render();
        } catch (error) {
          app.innerHTML = `<div class="error">Could not load profile: ${escapeHtml(error.message)}</div>`;
        }
      }

      search.addEventListener("input", render);
      profileSelect.addEventListener("change", loadSelectedProfile);
      loadSelectedProfile();
    </script>
  </body>
</html>
